# oapi-codegen 配置 —— Spec-first：契约改了重新生成，不手改 api.gen.go
package: api
output: internal/api/api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
output-options:
  skip-prune: true
  # 两个 OIDC 浏览器导航端点（302 + Set-Cookie）由 httpapi/oidc.go 手写挂载，不走 JSON 生成层
  exclude-operation-ids: [oidcStart, oidcCallback]
