openapi: 3.0.3
info:
  title: Melete API
  version: 0.1.0
  description: |
    题库驱动的学习平台。

    设计要点：**答案不是单一字段，而是一组带来源的「主张」**（`AnswerClaim`）。
    884 道有对照数据的题里 38% 存在题库标注与社区投票不一致，
    界面上并列呈现各方主张本身就是最好的学习材料。

servers:
  - url: /api/v1

# 认证：Bearer access token（见 docs/design/active/deployment.md §0）。
#
# 本 API 对公网暴露（web 与 iOS 都是平等客户端），因此不存在「可信的调用方」——
# 曾有过的服务间共享密钥已移除：原生 App 反编译即得密钥，它挡不住任何人。
# 身份只由 access token 的签名保证，accountId 取自其 sub。
security:
  - accessToken: []

tags:
  - name: bank
    description: 题库
  - name: question
    description: 题目
  - name: auth
    description: 认证（仅供 web 服务端调用 —— 本 API 不对公网暴露）
  - name: study
    description: 学习记录（作答 / 自评 / 个人统计）

paths:
  /auth/password:
    post:
      tags: [auth]
      summary: 用户名密码登录
      operationId: passwordLogin
      security: []          # 登录前尚无 token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: 认证通过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/sso:
    post:
      tags: [auth]
      summary: 用 Akasha id_token 换取本 API 的 token
      description: |
        web 与 iOS 各自完成 OIDC 流程后，把拿到的 id_token 交给本端点。

        **id_token 由本 API 自己验签**（Akasha JWKS + issuer + audience）——
        绝不接受客户端自称的 sub：那等于任何人都能登录任意账号。
      operationId: ssoExchange
      security: []          # 登录前尚无 token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoExchange" }
      responses:
        "200":
          description: 账号已确立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: id_token 无效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/oidc/start:
    get:
      tags: [auth]
      summary: 发起 Akasha 登录（浏览器导航，302）
      description: |
        后端替所有客户端当 Akasha 的 OIDC client（confidential + PKCE），
        web 与 iOS 共用同一 client_id → 同一 pairwise sub → 同一账号。
        生成 state / nonce / PKCE 存签名 cookie 后 302 到 Akasha /authorize。
        本端点由 httpapi/oidc.go 手写挂载，不经生成层。
      operationId: oidcStart
      parameters:
        - name: next
          in: query
          description: |
            登录后去向。web 传本站绝对路径（如 /banks/aws-saa-c03）；
            iOS 固定传 `melete://auth/callback`（可带 ?then=应用内目标）。其余值一律丢弃。
          schema: { type: string }
      responses:
        "302": { description: 跳转到 Akasha }

  /auth/oidc/callback:
    get:
      tags: [auth]
      summary: Akasha 回调（浏览器导航，302）
      description: |
        验 state → 用 client_secret 换 code → 验 id_token 与 nonce → 确立账号 → 签发本站 token。
        · iOS：302 `melete://auth/callback#access_token=…&refresh_token=…&expires_in=…`
        · web：302 `{WEB_ORIGIN}/auth/callback?ticket=<refresh_token>&next=…`，
          web 服务端拿 ticket 去 /auth/refresh 换新的一对（轮换让 URL 里的票用一次即废）
        · 失败：302 回客户端并带 `oidc_error ∈ {cancelled, state, upstream, application}`
      operationId: oidcCallback
      parameters:
        - { name: code,  in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: 跳转回客户端 }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 用 refresh token 换新的 access token
      operationId: refreshToken
      security: []          # access 已过期，此处只认 refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 已换发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: refresh token 无效、已过期或已吊销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出（吊销该会话）
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: 已吊销（幂等：token 不存在也返回 204）

  /auth/register/code:
    post:
      tags: [auth]
      summary: 发注册验证码
      description: |
        ⛔ 邮箱已被占用时【仍然返回 204】—— 否则这个端点就是一个
        「这个邮箱注册过没有」的查询接口。真正的处置是给那个地址的主人
        发一封「有人用你的邮箱注册」的通知：⭐ 知情权落在地址主人身上，
        ⛔ 不落在请求方身上。
      operationId: sendRegisterCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email]
              properties:
                username: { type: string }
                email:    { type: string, format: email }
      responses:
        "204": { description: 已受理（⛔ 无论邮箱是否已被占用） }
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register:
    post:
      tags: [auth]
      summary: 完成注册
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email, code]
              properties:
                username:    { type: string }
                password:    { type: string }
                email:       { type: string, format: email }
                code:        { type: string }
                displayName: { type: string }
                deviceInfo:  { type: string }
      responses:
        "200":
          description: 注册成功，直接登录
          content:
            application/json:
              schema:
                type: object
                required: [tokens, breached, breachCount, checked]
                properties:
                  tokens:      { $ref: "#/components/schemas/TokenPair" }
                  breached:    { type: boolean }
                  breachCount: { type: integer }
                  checked:     { type: boolean, description: ⛔ false 时不得显示为「密码安全」 }
        "400":
          description: 验证码无效 / 密码不合规 / 用户名或邮箱已被占用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/recovery/code:
    post:
      tags: [auth]
      summary: 发找回验证码
      description: |
        ⛔⛔ 无论该地址有没有账号、有没有已验证邮箱，一律返回 204。
        ⚠️ 任何差别（返回码、耗时、文案）都会让它变成
        「这个邮箱有账号吗」的查询接口。
        ⭐ 联邦账号在这里自然落空（没有本应用验证过的邮箱）——
        案卷 §18.3.2：「不实现 = 安全」，⛔ 不是「忘记实现 = 洞」。
      operationId: sendRecoveryCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: 已受理（⛔ 无论该地址是否可找回） }
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/recovery/complete:
    post:
      tags: [auth]
      summary: 用验证码重置密码
      operationId: completeRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:       { type: string, format: email }
                code:        { type: string }
                newPassword: { type: string }
      responses:
        "200":
          description: 已重置（旧会话全部吊销，需重新登录）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordChanged" }
        "400":
          description: 验证码无效 / 新密码不合规
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/email/code:
    post:
      tags: [auth]
      summary: 给新邮箱发验证码（改邮箱第一步）
      description: |
        ⛔ 不改库。新地址已被占用时对请求方【仍然成功】（防枚举），
        但给那个地址的主人发一封通知。
      operationId: sendEmailChangeCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail]
              properties:
                newEmail: { type: string, format: email }
      responses:
        "204": { description: 已受理 }
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/email/confirm:
    post:
      tags: [auth]
      summary: 确认改邮箱
      description: |
        ⭐ 会给【旧邮箱】发一封「你的邮箱被改成了 X」的通知 ——
        那不是礼貌，是安全要件：它是账号接管链上唯一会让受害者察觉的信号。
        ⚠️ 改完会吊销全部会话并为当前设备重签；tokens 缺失表示没重签
        （邮箱已改好），⛔ 不代表失败。
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:       { type: string }
                deviceInfo: { type: string }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: 验证码无效 / 邮箱已被占用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/password/change:
    post:
      tags: [auth]
      summary: 修改密码 / 首次设置密码
      description: |
        ⭐ 两件事同一个入口：**要不要验旧密码由账号当前有没有密码决定**，
        ⛔ 不由请求里传不传 oldPassword 决定 —— 否则漏传就等于跳过了旧密码校验。
        纯 OIDC 账号（从未设过密码）调用时 oldPassword 留空即可。

        ⚠️ 改密会吊销该账号【全部】会话，并为当前设备重签一对新 token。
        若响应里没有 tokens，说明没有重签（口令已改好），⛔ 不代表失败 —— 需重新登录。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                oldPassword:
                  type: string
                  description: 当前密码；首次设置密码时留空
                newPassword: { type: string }
                deviceInfo:  { type: string }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordChanged" }
        "400":
          description: 新密码不符合要求
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: 当前密码不正确
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/sessions:
    get:
      tags: [auth]
      summary: 我的登录设备
      description: |
        ⛔ 返回值里【没有任何 token 或哈希字段】—— 那是撤销凭据，
        把它摆到界面上等于让任何能看到屏幕的人拿走会话。
      operationId: listSessions
      responses:
        "200":
          description: 当前有效的会话
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }

  /auth/sessions/revoke-others:
    post:
      tags: [auth]
      summary: 登出其它设备（保留当前这台）
      description: |
        ⭐ 「保留哪一条」取自当前 access token 的 sid，⛔ 不接受客户端指定 ——
        否则任何人都能构造一个「保留别人的会话、踢掉我的」的请求。
        ⚠️ 若当前 token 没有 sid（阶段 3 之前签发的旧票），返回 409 而
        ⛔ 不退化成「登出全部」—— 那会把一次误操作放大成全员掉线。
      operationId: revokeOtherSessions
      responses:
        "200":
          description: 已登出其它设备
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, description: 被登出的会话数 }
        "409":
          description: 当前令牌不含会话标识，请重新登录后再试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /attempts:
    post:
      tags: [study]
      summary: 记录一次作答（揭晓即记录；对错由服务端按参考答案判定）
      description: |
        ⭐ 2026-09-08 起：作答在**揭晓答案那一刻**就记录，⛔ 不再依赖自评。
        rating 不再必填 —— 不评分也留下完整的一条 attempt（对错、用时、出处）。
        自评是可选增强，通过 `PATCH /attempts/{id}` 补上，届时才驱动 FSRS 卡片调度。
      operationId: recordAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttemptInput" }
      responses:
        "200":
          description: 已记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attempts/{id}:
    patch:
      tags: [study]
      summary: 给一条已记录的作答补上自评（驱动 FSRS 卡片调度）
      description: |
        只更新自己的 attempt（服务端按会话账号校验归属）。补上 rating 后才排卡片、返回调度结果。
      operationId: rateAttempt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingInput" }
      responses:
        "200":
          description: 已评分
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/progress:
    get:
      tags: [study]
      summary: 我的学习进度总览
      operationId: getMyProgress
      parameters:
        - $ref: "#/components/parameters/BankQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }

  /me/tag-stats:
    get:
      tags: [study]
      summary: 按标签的正确率（「我哪里不会」）
      description: |
        `attempt ⋈ question_tag ⋈ tag` 聚合。每题只取**最近一次**作答参与统计 ——
        否则反复重做同一道错题会把正确率越刷越低，与直觉相反。
      operationId: getMyTagStats
      parameters:
        - $ref: "#/components/parameters/BankQuery"
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [domain, topic, concept] }
        - name: minAttempts
          in: query
          description: 至少做过几道才纳入（样本太小的标签正确率没有意义）
          schema: { type: integer, minimum: 1, default: 3 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagStat" }

  /me/overview:
    get:
      tags: [study]
      summary: 跨题库总览（今天 / 连续天数 / 累计）
      description: 首页统计带。全部从 attempt 推导；连续天数按 Asia/Tokyo 自然日计。
      operationId: getMyOverview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }

  /me/recent:
    get:
      tags: [study]
      summary: 最近的学习会话（跨题库）
      description: |
        从 attempt 推导：同一题库、同一 context、相邻间隔 ≤ 30 分钟的连续作答算一次会话。
        不存会话表 —— 会话是对事实的解释，不是事实。
      operationId: getMyRecent
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudySession" }

  /me/resume:
    get:
      tags: [study]
      summary: 继续学习（上次刷到哪）
      description: 从 attempt 推导，不额外维护断点表 —— 少一处要保持一致的状态。
      operationId: getMyResume
      parameters:
        - $ref: "#/components/parameters/BankQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resume" }

  /banks:
    get:
      tags: [bank]
      summary: 题库列表
      operationId: listBanks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bank" }

  /banks/{slug}:
    get:
      tags: [bank]
      summary: 题库详情与统计
      operationId: getBank
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /banks/{slug}/tags:
    get:
      tags: [bank]
      summary: 题库的标签列表（用于筛选与正确率热图）
      operationId: listBankTags
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: type
          in: query
          description: 只返回某一类标签
          schema: { type: string, enum: [domain, topic, concept] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }

  /banks/{slug}/questions:
    get:
      tags: [question]
      summary: 题目列表（分页 + 标签筛选）
      operationId: listQuestions
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: tag
          in: query
          description: 标签 id，可重复；多个标签取交集
          schema:
            type: array
            items: { type: integer, format: int64 }
        - name: contested
          in: query
          description: 只返回存在答案分歧的题（题库标注 ≠ 社区投票）
          schema: { type: boolean }
        - name: enriched
          in: query
          description: 只返回已完成 AI 富化的题
          schema: { type: boolean }
        - name: mode
          in: query
          description: |
            学习模式过滤（全部需要会话，账号取自 JWT 而非请求参数）：
            wrong = 最近一次作答是错的；unsure = 最近一次自评 rating ≤ 2；
            unseen = 从未作答；
            due = FSRS 复习队列，卡片已到期。

            ⚠️ due 与 unseen 互斥且不重叠：没做过的题没有卡片，不算「到期」。
            两者混进一个数字会让「今天要复习 300 题」失去意义。
            ⚠️ due 按【到期时间】升序返回，其余模式按原题号 —— 复习队列不是浏览列表。
          schema: { type: string, enum: [wrong, unsure, unseen, due] }

        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{id}:
    get:
      tags: [question]
      summary: 单题详情（题干 + 选项 + 各方答案主张 + 解析 + 标签）
      operationId: getQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        本 API 签发的 access token（HS256，TTL 1 小时，对齐 geass-v3 规范）。
        过期后用 refresh token 调 /auth/refresh 换新的。

  parameters:
    BankQuery:
      name: bank
      in: query
      description: 题库 slug；缺省 = 当前题库（现阶段为第一个题库）
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      description: 题库 slug，如 aws-saa-c03
      schema: { type: string }

  responses:
    TooManyRequests:
      description: 登录尝试过于频繁
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Progress:
      type: object
      required: [bankSlug, questionCount, seenCount, correctCount, wrongCount, unsureCount, attemptCount, dueCount]
      properties:
        bankSlug:     { type: string }
        questionCount: { type: integer, description: 题库总题数 }
        seenCount:    { type: integer, description: 做过的题数（去重） }
        correctCount: { type: integer, description: 最近一次作答为对的题数 }
        wrongCount:   { type: integer, description: 最近一次作答为错的题数 }
        unsureCount:  { type: integer, description: 最近一次自评 ≤2 的题数 }
        attemptCount: { type: integer, description: 总作答次数（含重做） }
        dueCount:
          type: integer
          description: |
            FSRS 复习队列里已到期的题数。
            ⚠️ **不含从没做过的题** —— 那些题没有卡片，属于「没做过」入口。
            两者混进一个数字，「今天要复习 300 题」就失去意义了，
            而那正是间隔重复最劝退的失败模式。
        lastActiveAt: { type: string, format: date-time }

    TagStat:
      type: object
      required: [tagId, type, value, total, correct, rate]
      properties:
        tagId:   { type: integer, format: int64 }
        type:    { type: string, enum: [domain, topic, concept] }
        value:   { type: string }
        i18n:
          type: object
          additionalProperties: { type: string }
        total:   { type: integer, description: 该标签下做过的题数 }
        correct: { type: integer }
        rate:    { type: number, format: float, description: 正确率 0-100 }

    Resume:
      type: object
      description: |
        「继续学习」的两条轨道，全部从 attempt 推导：
        · sequential —— 顺序进度：题号最小的没做过的题，无需存状态
        · focus —— 上次专项：最近一条 context.mode ∉ {unseen, all} 的作答的出处；从未做过专项时缺省
      required: [bankSlug, sequential]
      properties:
        bankSlug:   { type: string }
        sequential: { $ref: "#/components/schemas/SequentialCursor" }
        focus:      { $ref: "#/components/schemas/FocusCursor" }

    Overview:
      type: object
      required: [todayCount, streakDays, seenTotal]
      properties:
        todayCount: { type: integer, description: 今天的作答次数 }
        streakDays: { type: integer, description: 连续有作答的自然日数（含今天；今天没做则从昨天起算） }
        seenTotal:  { type: integer, description: 跨题库做过的题数（去重） }

    StudySession:
      type: object
      required: [bankSlug, bankName, context, label, startedAt, endedAt, count, correct]
      properties:
        bankSlug:  { type: string }
        bankName:  { type: string }
        context:   { $ref: "#/components/schemas/DrillContext" }
        label:     { type: string, description: mode=tag 时为标签名，否则为 mode }
        tag:       { $ref: "#/components/schemas/Tag" }
        startedAt: { type: string, format: date-time }
        endedAt:   { type: string, format: date-time }
        count:     { type: integer }
        correct:   { type: integer }
        firstNo:   { type: integer, description: 顺序刷时的起止题号，便于显示 "#400–#413" }
        lastNo:    { type: integer }

    SequentialCursor:
      type: object
      required: [doneCount, totalCount]
      description: questionId 缺省 = 题库已全部做过一遍
      properties:
        questionId: { type: integer, format: int64 }
        externalNo: { type: integer }
        stem:       { type: string }
        doneCount:  { type: integer, description: 做过的题数（去重） }
        totalCount: { type: integer, description: 题库总题数 }
        lastAt:     { type: string, format: date-time, description: 上次顺序作答时间 }

    FocusCursor:
      type: object
      required: [context, label, total, lastAt]
      properties:
        context: { $ref: "#/components/schemas/DrillContext" }
        label:   { type: string, description: mode=tag 时为标签 value，否则为 mode 名 }
        tag:     { $ref: "#/components/schemas/Tag" }
        done:    { type: integer, description: 集合内做过的题数；只有 tag / contested 有意义 }
        total:   { type: integer, description: 集合当前大小 }
        lastAt:  { type: string, format: date-time }

    DrillContext:
      type: object
      description: 一次作答的出处 —— 用户是从哪个入口做的这道题
      required: [mode]
      properties:
        mode:  { type: string, enum: [all, unseen, wrong, unsure, contested, tag, due] }
        tagId: { type: integer, format: int64, description: mode=tag 时必填 }

    AttemptInput:
      type: object
      required: [questionId, chosen]
      properties:
        questionId: { type: integer, format: int64 }
        chosen:     { type: string, description: 排序后的字母集合，如 "AB" }
        rating:
          type: integer
          minimum: 1
          maximum: 4
          description: |
            ⭐ 可选。FSRS 标准四键自评 1=Again 2=Hard 3=Good 4=Easy。
            揭晓即记录不需要它；一般留空、稍后经 PATCH /attempts/{id} 补。
        durationMs: { type: integer }
        context:    { $ref: "#/components/schemas/DrillContext" }

    RatingInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 4
          description: FSRS 标准四键自评 1=Again 2=Hard 3=Good 4=Easy

    AttemptResult:
      type: object
      required: [correct]
      properties:
        attemptId: { type: integer, format: int64, description: 这条作答的 id —— 供随后 PATCH 补自评 }
        correct: { type: boolean, description: 服务端按参考答案判定 }
        reference: { $ref: "#/components/schemas/Reference" }
        schedule: { $ref: "#/components/schemas/ScheduleResult" }

    ScheduleResult:
      type: object
      description: |
        这次作答之后的记忆调度结果（FSRS）。

        **自评的可信度纠正**：`rating` 是用户按下的键、原样落进 attempt 表；
        `effectiveRating` 是实际喂给调度器的值。两者不同时 `reasons` 说明为什么 ——
        ⛔ 界面必须把理由显示出来，不得偷偷改调度。
        这与三方答案主张并列展示是同一条哲学：不替学习者下结论，把分歧摆出来。

        当前的纠正规则：
        · 答错却自评「掌握 / 轻松」→ 压到 1（作答顺序是【揭晓之后】才自评，
          答案就在眼前，不存在「只是没算准」的解释空间）
        · 答对但用时短到读不完题面 → 压到 2（答对了，但这次答对提供不了「你会」的证据）
        · 没有任何答案主张的题（题库里 6 道）→ 不纠正，判不了对错就不拿对错说事
      required: [rating, effectiveRating, reasons, due, state]
      properties:
        rating:          { type: integer, minimum: 1, maximum: 4, description: 用户按下的自评键 }
        effectiveRating: { type: integer, minimum: 1, maximum: 4, description: 实际用于调度的评分，只会 ≤ rating }
        reasons:
          type: array
          description: 纠正理由，未纠正时为空数组
          items: { type: string }
        due:   { type: string, format: date-time, description: 这道题下次该出现的时间（UTC） }
        state: { type: string, enum: [new, learning, review, relearning], description: 调度后的卡片状态 }

    Reference:
      type: object
      description: |
        判对错用的参考答案。优先级 ai_verdict > community_vote > bank_label ——
        AI 是唯一看过全部信息并给出理由的来源；题库标注是四个来源里
        最不该被无条件信任的那个（38% 与社区投票不一致）。
        仅用于给出反馈信号，界面仍并列展示全部主张。
      required: [answer, source]
      properties:
        answer: { type: string }
        source: { type: string, enum: [bank_label, community_vote, ai_verdict, user_note] }

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        deviceInfo: { type: string, description: 设备标识，用于「我的登录设备」 }

    SsoExchange:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, description: Akasha 签发的 id_token（由本 API 验签） }
        deviceInfo: { type: string, description: 设备标识，用于「我的登录设备」 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    PasswordChanged:
      type: object
      required: [breached, breachCount, checked, revokedCount]
      properties:
        breached:
          type: boolean
          description: 新密码出现在已知泄露集合中（⭐ 仍然放行，见 checked）
        breachCount:
          type: integer
          description: |
            出现次数。⭐ 警告的说服力几乎全在这个数字上 ——
            「出现过 3 次」与「出现过 200 万次」对用户是完全不同的风险。
        checked:
          type: boolean
          description: |
            是否真的完成了一次泄露检查。
            ⛔⛔ 前端不得把 checked=false && breached=false 显示成「密码安全」——
            checked=false 有两种成因（未启用 / 查询失败），对用户没有区别：
            两种情况下「没有警告」都不等于「这个密码是安全的」。
        revokedCount:
          type: integer
          description: 被吊销的会话数（含当前那条）
        tokens:
          allOf: [{ $ref: "#/components/schemas/TokenPair" }]
          description: |
            为当前设备重签的新 token。
            ⚠️ 缺失表示没有重签（密码已改好），⛔ 不代表失败 —— 用户需重新登录。

    SessionInfo:
      type: object
      required: [id, createdAt, lastActiveAt, expiresAt, current]
      properties:
        id:           { type: string, description: 会话 id（canonical UUID） }
        createdAt:    { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        expiresAt:    { type: string, format: date-time }
        deviceInfo:   { type: string, description: User-Agent 摘要，供用户辨认「这是不是我」 }
        clientIp:
          type: string
          description: |
            ⚠️ 必须是【解析后的可信 IP】，⛔ 不得是 X-Forwarded-For 整条链 ——
            那是客户端可伪造的，展示给用户等于给他看一条攻击者能随便写的字符串。
        current:      { type: boolean, description: 是否就是发起本次请求的这条会话 }

    TokenPair:
      type: object
      description: |
        access 是 JWT（不落库，TTL 1h）；refresh 是不透明随机串（落库，可吊销）。
        对齐 geass-v3：refresh 不做成 JWT —— 生命周期以月计的凭证必须能撤回。
      required: [accessToken, refreshToken, expiresIn, accountId, display]
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }
        expiresIn:    { type: integer, description: access token 剩余秒数（非绝对时间，免受客户端时钟偏差影响） }
        # ⚠️ 2026-09-07 breaking change：integer/int64 → string（canonical UUID）。
        # 账号 id 从 BIGINT 自增换成 UUIDv7（cross-exam 005 §22.2）——
        # 理由是 TiDB 跳号严重，且 v7 时间有序避免 v4 的索引页分裂。
        # ⛔ 消费方（web / iOS）必须同步改，⚠️ 旧 token 里的数字 sub 会被拒。
        # ⛔ 刻意【不写 format: uuid】：那会让 oapi-codegen 产出
        # openapi_types.UUID，于是 httpapi 层要多一次 UUID↔string 转换 ——
        # 而「编解码只有一处」是本项目的硬规则（见 internal/localauthx/uuid.go）。
        # 契约上它就是一个字符串；形态由 pattern 说明，⛔ 不由类型强加。
        accountId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: 账号 id（canonical UUIDv7 文本）
        display:      { type: string }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Bank:
      type: object
      required: [id, slug, name, locale, kind, meta]
      properties:
        id:          { type: integer, format: int64 }
        slug:        { type: string, example: aws-saa-c03 }
        name:        { type: string }
        description: { type: string }
        locale:      { type: string, example: zh }
        kind:        { type: string, enum: [cert, custom] }
        meta:        { $ref: "#/components/schemas/BankMeta" }

    BankMeta:
      type: object
      description: |
        题库的**自描述展示元数据**。前端不得写死任何题库特有的词：
        标签轴叫什么（AWS 是「服务」、LPIC 是「命令与工具」）、考纲权重、及格线，
        全部从这里读。换一个题库只有这个对象不同，页面代码零改动。
      properties:
        tagTypes:
          type: object
          description: 以标签 type（domain / topic / concept）为键
          additionalProperties: { $ref: "#/components/schemas/TagTypeMeta" }
        passScore: { type: integer, description: 官方及格分（无则不显示及格线） }
        maxScore:  { type: integer, description: 满分 }

    TagTypeMeta:
      type: object
      properties:
        label:
          type: object
          description: locale → 该标签轴的显示名
          additionalProperties: { type: string }
        weights:
          type: object
          description: 标签 value → 官方权重百分比（通常只有 domain 轴有）
          additionalProperties: { type: number }

    BankDetail:
      allOf:
        - $ref: "#/components/schemas/Bank"
        - type: object
          required: [stats]
          properties:
            stats: { $ref: "#/components/schemas/BankStats" }

    BankStats:
      type: object
      description: 题库的内容侧统计（与用户无关）
      required: [questionCount, enrichedCount, contestedCount]
      properties:
        questionCount:  { type: integer, description: 题目总数 }
        enrichedCount:  { type: integer, description: 已完成 AI 富化的题数 }
        contestedCount: { type: integer, description: 题库标注与社区投票不一致的题数 }

    Tag:
      type: object
      description: 通用 (type, value) 结构，不硬编码任何特定题库的分类体系
      required: [id, type, value]
      properties:
        id:    { type: integer, format: int64 }
        type:  { type: string, enum: [domain, topic, concept] }
        value: { type: string, example: "S3" }
        i18n:
          type: object
          additionalProperties: { type: string }
        questionCount: { type: integer, description: 挂在该标签下的题数 }

    Choice:
      type: object
      required: [label, body]
      properties:
        label: { type: string, example: "A" }
        body:  { type: string }

    AnswerClaim:
      type: object
      description: |
        一条带来源的答案主张。同一道题可以有多条，**故意不做合并**。
        `bank_label` 与 `community_vote` 不一致的情况占 38%，
        并列展示分歧并给出 AI 的裁决理由，正是本项目的核心价值。
      required: [source, answer]
      properties:
        source:
          type: string
          enum: [bank_label, community_vote, ai_verdict, user_note]
        answer:
          type: string
          description: 排序后的字母集合，如 "AB"
          example: "B"
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: 无则省略
        rationale:
          type: string
          description: 为什么；AI 裁决必有
        meta:
          type: object
          description: 如社区投票分布 {"A":80,"C":20}
          additionalProperties: true

    Explanation:
      type: object
      required: [source, locale, body]
      properties:
        source: { type: string, enum: [ai, editor, user] }
        locale: { type: string, example: zh }
        body:   { type: string }

    QuestionSummary:
      type: object
      required: [id, externalNo, stem, kind, pickCount, contested, enriched]
      properties:
        id:         { type: integer, format: int64 }
        externalNo: { type: integer, description: 原题号，用于溯源 }
        stem:       { type: string }
        kind:       { type: string, enum: [single, multi] }
        pickCount:  { type: integer }
        contested:  { type: boolean, description: 题库标注与社区投票是否不一致 }
        enriched:   { type: boolean, description: 是否已完成 AI 富化 }

    QuestionDetail:
      allOf:
        - $ref: "#/components/schemas/QuestionSummary"
        - type: object
          required: [bankSlug, choices, claims, explanations, tags]
          properties:
            bankSlug:  { type: string }
            reference: { $ref: "#/components/schemas/Reference" }
            dataIssue:
              type: string
              description: 题目本身有缺陷时的说明（题库脏点），正常不出现
            choices:
              type: array
              items: { $ref: "#/components/schemas/Choice" }
            claims:
              type: array
              items: { $ref: "#/components/schemas/AnswerClaim" }
            explanations:
              type: array
              items: { $ref: "#/components/schemas/Explanation" }
            tags:
              type: array
              items: { $ref: "#/components/schemas/Tag" }
            warnings:
              type: array
              description: P0 解析阶段的告警，不静默丢弃
              items: { type: string }

    QuestionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QuestionSummary" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }
